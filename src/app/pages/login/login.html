<div class="login-container">
  <!-- Logo superior -->
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
  </header>

  <!-- Caja del login -->
  <div class="login-box">
    <h2>¡BIENVENIDO!</h2>

    <form>
      <form [formGroup]="formulario" (ngSubmit)="OnLogin()"></form>
      <label for="usuario">Usuario (Email)</label>
      <input type="email" id="usuario" formControlName="email" />

      @if (formulario.get('email')?.invalid && formulario.get('email')?.touched) {
      <small class="text-danger">Ingresá un email válido.</small>
      }

      <label for="password">Contraseña</label>
      <input type="password" id="password" formControlName="contraseña" />

      <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

      <div class="actions">
        <button type="button" class="btn-login" (click)="OnLogin()">INICIAR SESIÓN</button>
      </div>

      <p class="register-text">
        ¿Aún no tienes cuenta?
        <a href="register">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
