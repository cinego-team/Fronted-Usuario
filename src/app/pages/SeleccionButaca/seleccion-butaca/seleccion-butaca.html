<header class="topbar">
  <img src="/assets/logo.png" alt="CineGo" class="logo" (click)="volver()" />
  <div class="user-section">
    <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
    <span>Usuario</span>
  </div>
</header>

<div class="wrapper">
  <div class="main-container">
    <!-- Panel Izquierdo: Butacas -->
    <main class="panel">
      <div class="screen">PANTALLA</div>

      <div class="rows">
        <div class="row" *ngFor="let r of rows">
          <div class="row-label">{{ r }}</div>
          <button
            *ngFor="let s of byRow(r); trackBy: trackBySeat"
            class="seat"
            [class.selected]="s.status === 'seleccionada'"
            [class.occupied]="s.status === 'ocupada'"
            [disabled]="s.status === 'ocupada'"
            (click)="toggle(s)"
          >
            {{ s.id }}
          </button>
          <div class="row-label">{{ r }}</div>
        </div>
      </div>

      <div class="legend">
        <span><span class="dot free"></span> Libre</span>
        <span><span class="dot selected"></span> Seleccionada</span>
        <span><span class="dot occupied"></span> Ocupada</span>
        <span class="count">Elegidas: {{ totalSelectedCount() }}</span>
      </div>

      <div class="actions">
        <button class="btn ghost" (click)="cancelar()">Cancelar</button>
        <button
          class="btn"
          [disabled]="totalSelectedCount() === 0"
          (click)="continuar()"
        >
          Continuar
        </button>
      </div>
    </main>

    <!-- Panel Derecho: Resumen -->
    <aside class="summary-panel">
      <h2>Resumen</h2>
      <div class="summary-box">
        <div class="summary-item">
          <span>Subtotal</span>
          <span>${{ subtotal() }}</span>
        </div>
        <div class="summary-item">
          <span>Descuento</span>
          <span>$0</span>
        </div>
        <div class="summary-item total">
          <span>Total</span>
          <span>${{ total() }}</span>
        </div>
      </div>
    </aside>
  </div>
</div>
