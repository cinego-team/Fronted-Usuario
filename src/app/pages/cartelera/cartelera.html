<header class="topbar">
  <a href="cartelera"><img src="/assets/logo.png" alt="CineGo" class="logo" /></a>
  <div class="user-section">
    <a href="mi-usuario" class="user-link">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </a>
  </div>
</header>
<div class="page cartelera">
  <h1 class="titulo-cartelera">CARTELERA</h1>

  <div class="peliculas-grid">
    <div
      class="pelicula-card"
      *ngFor="let pelicula of peliculas"
      (click)="seleccionarPelicula(pelicula)"
    >
      <div class="poster-container">
        <img [src]="pelicula.urlImagen" [alt]="pelicula.titulo" class="poster-img" loading="lazy" />
      </div>

      <div class="pelicula-info">
        <h3 class="pelicula-titulo">{{ pelicula.titulo }}</h3>
        <p class="pelicula-detalles">{{ pelicula.clasificacion }} - {{ pelicula.genero }}</p>
      </div>
    </div>
  </div>
</div>
